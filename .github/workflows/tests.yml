name: tests

on:
  push:
  pull_request:

jobs:
  black-box:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sobe API e banco de teste e roda a suite (so HTTP)
        run: docker compose --profile test run --rm tests

      - name: Log da API se algo falhar
        if: failure()
        run: docker compose --profile test logs api_test db_test

      - name: Limpa
        if: always()
        run: docker compose --profile test down -v
