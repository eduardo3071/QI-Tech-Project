services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: antecipa_saude
    volumes:
      - ./database/database.sql:/docker-entrypoint-initdb.d/database.sql:ro
      - antecipa_saude_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: antecipa_saude_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data   # descartavel: o pytest recria o schema a cada rodada

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/antecipa_saude
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db_test:5432/antecipa_saude_test
    ports:
      - "8000:8000"

volumes:
  antecipa_saude_data:
